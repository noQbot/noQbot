<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'JetBrains Mono','SFMono-Regular','Consolas','Courier New',monospace">
  <defs>
    <radialGradient id="redglow" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#d71921" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#d71921" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#d71921" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4048" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff4048" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff4048" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d71921" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="2" y="2" width="1196" height="336" rx="18" fill="#050506" stroke="#d71921" stroke-opacity="0.35"/>
  <rect x="2" y="2" width="1196" height="336" rx="18" fill="url(#grid)"/>
  <ellipse cx="600" cy="20" rx="540" ry="150" fill="url(#redglow)"/>

  <!-- scanline -->
  <rect x="4" y="6" width="1192" height="2" fill="#ff4048" opacity="0.16">
    <animate attributeName="y" values="12;326;12" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#ff4048" stroke-width="3" fill="none" stroke-opacity="0.85">
    <path d="M28 60 V28 H60"/>
    <path d="M1140 28 H1172 V60"/>
    <path d="M28 280 V312 H60"/>
    <path d="M1172 280 V312 H1140"/>
  </g>

  <!-- top labels -->
  <text x="42" y="52" font-size="15" fill="#8f8f8f">// vinv.ai</text>
  <text x="1096" y="51" font-size="15" fill="#d8d8d8" text-anchor="end">LIVE</text>
  <circle cx="1110" cy="46" r="5" fill="#ff4048">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- glow layer (only Q visible) -->
  <text x="418" y="188" font-size="96" font-weight="700" letter-spacing="2" text-anchor="start" filter="url(#glow)" fill="#ff4048">
    <tspan fill="none">no</tspan><tspan>Q</tspan><tspan fill="none">bot</tspan>
    <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- wordmark -->
  <text x="418" y="188" font-size="96" font-weight="700" letter-spacing="2" text-anchor="start">
    <tspan fill="#f4f4f4">no</tspan><tspan fill="#ff4048">Q</tspan><tspan fill="#f4f4f4">bot</tspan><tspan fill="#ff4048" dx="8">▮<animate attributeName="opacity" values="1;1;0;0" dur="1.05s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- underline + moving highlight -->
  <rect x="420" y="210" width="352" height="2" fill="#d71921" opacity="0.3"/>
  <rect x="420" y="209" width="120" height="3" fill="url(#sweep)">
    <animate attributeName="x" values="420;652;420" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="600" y="252" font-size="21" letter-spacing="8" text-anchor="middle" fill="#dcdcdc" opacity="0.92">NO QUEUE&#160;&#160;&#8594;&#160;&#160;INSTANT&#160;&#160;&#183;&#160;&#160;ZERO WAIT</text>

  <!-- pun line -->
  <text x="600" y="292" font-size="15" letter-spacing="2" text-anchor="middle" fill="#8f8f8f">sounds like "no clue" — ships like it has every clue</text>
</svg>
