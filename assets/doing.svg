<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" width="900" height="196" font-family="'JetBrains Mono','SFMono-Regular','Consolas','Courier New',monospace">
  <defs>
    <filter id="cardglow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d71921" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- CARD 1 : UNDERSTAND -->
  <g filter="url(#cardglow)">
    <rect x="6" y="8" width="282" height="180" rx="14" fill="#0c0c0f" stroke="#d71921" stroke-opacity="0.32"/>
  </g>
  <rect x="6" y="8" width="282" height="4" rx="2" fill="#ff4048"/>
  <circle cx="272" cy="26" r="3" fill="#ff4048"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <g stroke="#ff4048" stroke-width="3" fill="none">
    <circle cx="140" cy="58" r="16"/>
    <line x1="152" y1="70" x2="164" y2="82"/>
  </g>
  <text x="147" y="120" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#f4f4f4">UNDERSTAND</text>
  <text x="147" y="146" text-anchor="middle" font-size="13" fill="#9a9a9e">read the repo,</text>
  <text x="147" y="166" text-anchor="middle" font-size="13" fill="#9a9a9e">not hallucinate it</text>

  <!-- CARD 2 : LOCATE -->
  <g filter="url(#cardglow)">
    <rect x="309" y="8" width="282" height="180" rx="14" fill="#0c0c0f" stroke="#d71921" stroke-opacity="0.32"/>
  </g>
  <rect x="309" y="8" width="282" height="4" rx="2" fill="#ff4048"/>
  <circle cx="575" cy="26" r="3" fill="#ff4048"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
  <g stroke="#ff4048" stroke-width="3" fill="none">
    <circle cx="450" cy="58" r="15"/>
    <line x1="450" y1="34" x2="450" y2="44"/>
    <line x1="450" y1="72" x2="450" y2="82"/>
    <line x1="426" y1="58" x2="436" y2="58"/>
    <line x1="464" y1="58" x2="474" y2="58"/>
  </g>
  <circle cx="450" cy="58" r="3.5" fill="#ff4048"/>
  <text x="450" y="120" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#f4f4f4">LOCATE</text>
  <text x="450" y="146" text-anchor="middle" font-size="13" fill="#9a9a9e">any function,</text>
  <text x="450" y="166" text-anchor="middle" font-size="13" fill="#9a9a9e">found instantly</text>

  <!-- CARD 3 : REFINE -->
  <g filter="url(#cardglow)">
    <rect x="612" y="8" width="282" height="180" rx="14" fill="#0c0c0f" stroke="#d71921" stroke-opacity="0.32"/>
  </g>
  <rect x="612" y="8" width="282" height="4" rx="2" fill="#ff4048"/>
  <circle cx="878" cy="26" r="3" fill="#ff4048"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  <g stroke="#ff4048" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M737 58 a16 16 0 1 1 -4.5 -11"/>
    <path d="M753 46 l0 12 l-12 0"/>
    <animateTransform attributeName="transform" type="rotate" from="0 753 58" to="360 753 58" dur="6s" repeatCount="indefinite"/>
  </g>
  <text x="753" y="120" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#f4f4f4">REFINE</text>
  <text x="753" y="146" text-anchor="middle" font-size="13" fill="#9a9a9e">same 4 lines, 200×,</text>
  <text x="753" y="166" text-anchor="middle" font-size="13" fill="#9a9a9e">until they're perfect</text>
</svg>
