<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" width="900" height="196" font-family="'Space Grotesk','Segoe UI Variable','Segoe UI',system-ui,sans-serif">
  <!-- CARD 1 : UNDERSTAND -->
  <rect x="6" y="8" width="282" height="180" rx="16" fill="#0b0c0f" stroke="#0F89F1" stroke-opacity="0.30"/>
  <rect x="6" y="8" width="282" height="4" rx="2" fill="#0F89F1"/>
  <circle cx="272" cy="26" r="3" fill="#0F89F1"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <g stroke="#0F89F1" stroke-width="3" fill="none">
    <circle cx="140" cy="58" r="16"/>
    <line x1="152" y1="70" x2="164" y2="82"/>
  </g>
  <text x="147" y="120" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#F9F7F9">UNDERSTAND</text>
  <text x="147" y="146" text-anchor="middle" font-size="13" font-family="'Inter','Segoe UI',system-ui,sans-serif" fill="#9a9ea5">read the repo,</text>
  <text x="147" y="166" text-anchor="middle" font-size="13" font-family="'Inter','Segoe UI',system-ui,sans-serif" fill="#9a9ea5">not hallucinate it</text>

  <!-- CARD 2 : LOCATE -->
  <rect x="309" y="8" width="282" height="180" rx="16" fill="#0b0c0f" stroke="#0F89F1" stroke-opacity="0.30"/>
  <rect x="309" y="8" width="282" height="4" rx="2" fill="#0F89F1"/>
  <circle cx="575" cy="26" r="3" fill="#0F89F1"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
  <g stroke="#0F89F1" stroke-width="3" fill="none">
    <circle cx="450" cy="58" r="15"/>
    <line x1="450" y1="34" x2="450" y2="44"/>
    <line x1="450" y1="72" x2="450" y2="82"/>
    <line x1="426" y1="58" x2="436" y2="58"/>
    <line x1="464" y1="58" x2="474" y2="58"/>
  </g>
  <circle cx="450" cy="58" r="3.5" fill="#0F89F1"/>
  <text x="450" y="120" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#F9F7F9">LOCATE</text>
  <text x="450" y="146" text-anchor="middle" font-size="13" font-family="'Inter','Segoe UI',system-ui,sans-serif" fill="#9a9ea5">any function,</text>
  <text x="450" y="166" text-anchor="middle" font-size="13" font-family="'Inter','Segoe UI',system-ui,sans-serif" fill="#9a9ea5">found instantly</text>

  <!-- CARD 3 : REFINE -->
  <rect x="612" y="8" width="282" height="180" rx="16" fill="#0b0c0f" stroke="#0F89F1" stroke-opacity="0.30"/>
  <rect x="612" y="8" width="282" height="4" rx="2" fill="#0F89F1"/>
  <circle cx="878" cy="26" r="3" fill="#0F89F1"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  <g stroke="#0F89F1" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M737 58 a16 16 0 1 1 -4.5 -11"/>
    <path d="M753 46 l0 12 l-12 0"/>
    <animateTransform attributeName="transform" type="rotate" from="0 753 58" to="360 753 58" dur="6s" repeatCount="indefinite"/>
  </g>
  <text x="753" y="120" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#F9F7F9">REFINE</text>
  <text x="753" y="146" text-anchor="middle" font-size="13" font-family="'Inter','Segoe UI',system-ui,sans-serif" fill="#9a9ea5">same 4 lines, 200×,</text>
  <text x="753" y="166" text-anchor="middle" font-size="13" font-family="'Inter','Segoe UI',system-ui,sans-serif" fill="#9a9ea5">until they're perfect</text>
</svg>
