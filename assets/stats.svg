<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" font-family="'Space Grotesk','Segoe UI Variable','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="sweep2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F89F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0F89F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F89F1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- TILE 1 -->
  <rect x="6" y="6" width="438" height="94" rx="12" fill="#0b0c0f" stroke="#0F89F1" stroke-opacity="0.30"/>
  <rect x="6" y="6" width="5" height="94" rx="2.5" fill="#0F89F1"/>
  <text x="34" y="40" font-size="13" letter-spacing="3" font-family="'Geist Mono','JetBrains Mono','Consolas',monospace" fill="#8a8e95">QUEUE TIME</text>
  <text x="34" y="78" font-size="30" font-weight="700" fill="#0F89F1">0ms</text>
  <circle cx="418" cy="28" r="3.5" fill="#0F89F1"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <rect x="18" y="93" width="120" height="2.5" fill="url(#sweep2)"><animate attributeName="x" values="18;320;18" dur="3.2s" repeatCount="indefinite"/></rect>

  <!-- TILE 2 -->
  <rect x="456" y="6" width="438" height="94" rx="12" fill="#0b0c0f" stroke="#0F89F1" stroke-opacity="0.30"/>
  <rect x="456" y="6" width="5" height="94" rx="2.5" fill="#0F89F1"/>
  <text x="484" y="40" font-size="13" letter-spacing="3" font-family="'Geist Mono','JetBrains Mono','Consolas',monospace" fill="#8a8e95">RESPONSE</text>
  <text x="484" y="78" font-size="30" font-weight="700" fill="#0F89F1">instant</text>
  <circle cx="868" cy="28" r="3.5" fill="#0F89F1"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
  <rect x="468" y="93" width="120" height="2.5" fill="url(#sweep2)"><animate attributeName="x" values="468;770;468" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></rect>

  <!-- TILE 3 -->
  <rect x="6" y="110" width="438" height="94" rx="12" fill="#0b0c0f" stroke="#0F89F1" stroke-opacity="0.30"/>
  <rect x="6" y="110" width="5" height="94" rx="2.5" fill="#0F89F1"/>
  <text x="34" y="144" font-size="13" letter-spacing="3" font-family="'Geist Mono','JetBrains Mono','Consolas',monospace" fill="#8a8e95">WAITING IN LINE</text>
  <text x="34" y="182" font-size="30" font-weight="700" fill="#0F89F1">never</text>
  <circle cx="418" cy="132" r="3.5" fill="#0F89F1"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
  <rect x="18" y="197" width="120" height="2.5" fill="url(#sweep2)"><animate attributeName="x" values="18;320;18" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></rect>

  <!-- TILE 4 -->
  <rect x="456" y="110" width="438" height="94" rx="12" fill="#0b0c0f" stroke="#0F89F1" stroke-opacity="0.30"/>
  <rect x="456" y="110" width="5" height="94" rx="2.5" fill="#0F89F1"/>
  <text x="484" y="144" font-size="13" letter-spacing="3" font-family="'Geist Mono','JetBrains Mono','Consolas',monospace" fill="#8a8e95">UPTIME</text>
  <text x="484" y="182" font-size="30" font-weight="700" fill="#0F89F1">always on</text>
  <circle cx="868" cy="132" r="3.5" fill="#0F89F1"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  <rect x="468" y="197" width="120" height="2.5" fill="url(#sweep2)"><animate attributeName="x" values="468;770;468" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></rect>
</svg>
