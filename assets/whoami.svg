<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" font-family="'Geist Mono','JetBrains Mono','SFMono-Regular','Consolas','Courier New',monospace">
  <defs>
    <radialGradient id="wglow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0F89F1" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#0F89F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- window : obsidian ground, 1px hairline (Inverse: flat, no shadow) -->
  <rect x="12" y="10" width="876" height="332" rx="16" fill="#08080a" stroke="#0F89F1" stroke-opacity="0.32"/>
  <ellipse cx="450" cy="12" rx="430" ry="90" fill="url(#wglow)"/>

  <!-- title bar -->
  <path d="M12 26 a16 16 0 0 1 16 -16 h844 a16 16 0 0 1 16 16 v26 h-876 z" fill="#0d0e12"/>
  <circle cx="38" cy="38" r="6.5" fill="#0F89F1"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="62" cy="38" r="6.5" fill="#2a2e36"/>
  <circle cx="86" cy="38" r="6.5" fill="#2a2e36"/>
  <text x="450" y="43" text-anchor="middle" font-size="15" fill="#7a7f87">noQbot — ~/inverse-vibe — zsh</text>
  <line x1="12" y1="52" x2="888" y2="52" stroke="#0F89F1" stroke-opacity="0.16"/>

  <!-- body -->
  <g font-size="20">
    <!-- $ whoami -->
    <g opacity="0">
      <text x="40" y="100"><tspan fill="#0F89F1">➜</tspan><tspan fill="#6f737a">  ~ </tspan><tspan fill="#F9F7F9">whoami</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.35s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="136" font-weight="700" fill="#0F89F1">noQbot</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.35s" fill="freeze"/>
    </g>

    <!-- $ cat .purpose -->
    <g opacity="0">
      <text x="40" y="180"><tspan fill="#0F89F1">➜</tspan><tspan fill="#6f737a">  ~ </tspan><tspan fill="#F9F7F9">cat .purpose</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.35s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="216" font-size="18" fill="#cfd2d6">building Inverse Vibe — AI that reads your codebase, not the vibes</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.35s" fill="freeze"/>
    </g>

    <!-- $ cat .status -->
    <g opacity="0">
      <text x="40" y="260"><tspan fill="#0F89F1">➜</tspan><tspan fill="#6f737a">  ~ </tspan><tspan fill="#F9F7F9">cat .status</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.35s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="296" fill="#7BB926">online · zero queue · answering now</text>
      <animate attributeName="opacity" from="0" to="1" begin="3.05s" dur="0.35s" fill="freeze"/>
    </g>

    <!-- prompt + blinking cursor -->
    <g opacity="0">
      <text x="40" y="332"><tspan fill="#0F89F1">➜</tspan><tspan fill="#6f737a">  ~ </tspan><tspan fill="#0F89F1">█</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0.15;0.15" dur="1.05s" begin="3.9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
