name: generate contribution snake

on:
  # run every day at 00:00 UTC so the snake stays in sync automatically
  schedule:
    - cron: "0 0 * * *"
  # allow manual runs from the Actions tab
  workflow_dispatch:
  # regenerate on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs (Vinv red on black)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23ff4048&color_dots=%230a0a0a,%233d0a0d,%237a141a,%23b81d26,%23ff4048

      - name: Add neon glow (white-hot head, glowing trail)
        run: |
          perl -0pi -e 's!</style>!.s\{filter:url(#neon)\}.s.s0\{fill:#ffe3e5\}.u\{filter:url(#neonsoft)\}</style><defs><filter id="neon" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="neonsoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>!' dist/snake.svg

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
